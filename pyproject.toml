[project]
name = "sqlguardllm"
version = "0.5.0a3"
description = "The SQL firewall for LLM apps: validate SQL written by AI and rewrite it read-only, allowlisted, row-filtered and limited."
readme = "docs/pypi.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Juan Castillo" }]
keywords = ["sql", "llm", "security", "text-to-sql", "nl2sql", "sqlglot", "guardrails", "row-level-security", "ai-safety", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["sqlglot>=30.0,<31"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
db = ["sqlalchemy>=2.0,<3"]
serve = ["pyyaml>=6.0"]  # YAML policy files; the server itself is standard library
mcp = ["mcp>=2.0.1,<3", "sqlalchemy>=2.0,<3", "pyyaml>=6.0"]
otel = ["opentelemetry-api>=1.20"]

[project.scripts]
sqlguardllm = "sqlguardllm.cli:main"

[project.urls]
Homepage = "https://github.com/jmmana/sqlguardllm"
Documentation = "https://github.com/jmmana/sqlguardllm/tree/main/docs"
Issues = "https://github.com/jmmana/sqlguardllm/issues"
Changelog = "https://github.com/jmmana/sqlguardllm/blob/main/CHANGELOG.md"
Source = "https://github.com/jmmana/sqlguardllm"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "types-PyYAML",
    "jsonschema>=4.23",
    "types-jsonschema",
    "ruff>=0.8",
    "mypy>=1.13",
    "mcp>=2.0.1,<3",
    "sqlalchemy>=2.0,<3",
    "duckdb>=1.5.6",
    "duckdb-engine>=0.17.0",
    "hypothesis>=6.100",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlguardllm"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs/pypi.md", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "PLR0915", "N818"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["fuzz: property-based fuzzing of the guard with canary data (tests/fuzz)"]
