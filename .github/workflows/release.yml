name: Release

# Publishes every release to PyPI, npm and NuGet, same version, with Trusted Publishing (OIDC):
# no API token is stored anywhere. Each registry trusts this exact workflow file, in
# jmmana/sqlguardllm, running in its environment: "pypi", "npm" and "nuget".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_version: ${{ steps.version.outputs.npm_version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tag, version and changelog agree
        id: version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The npm client moves in lockstep: 0.5.0a1 -> 0.5.0-alpha.1, b -> beta, rc -> rc.
          npm_version=$(echo "$version" | sed -E 's/a([0-9]+)$/-alpha.\1/; s/b([0-9]+)$/-beta.\1/; s/rc([0-9]+)$/-rc.\1/')
          node_version=$(python3 -c "import json;print(json.load(open('clients/node/package.json'))['version'])")
          if [ "$npm_version" != "$node_version" ]; then
            echo "clients/node/package.json has $node_version, expected $npm_version"; exit 1
          fi
          # The four .NET packages share one version, in clients/dotnet/Directory.Build.props.
          dotnet_version=$(sed -nE 's#.*<Version>(.*)</Version>.*#\1#p' clients/dotnet/Directory.Build.props)
          if [ "$npm_version" != "$dotnet_version" ]; then
            echo "clients/dotnet/Directory.Build.props has $dotnet_version, expected $npm_version"; exit 1
          fi
          if grep -rq '<Version>' clients/dotnet/src --include=*.csproj; then
            echo "a .csproj under clients/dotnet/src sets its own <Version>; it must come from Directory.Build.props"; exit 1
          fi
          # Before 1.0 every release is a prerelease, so `latest` (what `npm install sqlguardllm`
          # and the npm page use) follows the newest one. From 1.0 on, prereleases get their own tag.
          case "$npm_version" in
            0.*) npm_tag=latest ;;
            *-alpha.*) npm_tag=alpha ;; *-beta.*) npm_tag=beta ;; *-rc.*) npm_tag=rc ;; *) npm_tag=latest ;;
          esac
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: uv sync --locked && uv run pytest
      - name: Build
        run: uv build
      - name: Check
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The five engine binaries, built and conformance-tested on their own native runners from this
  # same commit (engine-binaries.yml). Nothing is published unless all of them pass.
  engines:
    name: Engine binaries
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/engine-binaries.yml

  # Checksums and signed build provenance for the binaries. The only job with id-token and
  # attestations write; it cannot publish anything.
  attest:
    name: Checksums and provenance attestations
    needs: [build, engines]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          merge-multiple: true
          path: engine-all/
      - name: SHA256SUMS of the release archives (five platforms, nothing else)
        run: |
          set -e
          mkdir engine-release
          cp engine-all/sqlguardllm-engine-* engine-release/
          test "$(find engine-release -type f | wc -l)" -eq 5
          cd engine-release
          sha256sum sqlguardllm-engine-* > SHA256SUMS
          cat SHA256SUMS
      # actions/attest-build-provenance v4.2.2, pinned by commit SHA.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: engine-release/*
      - uses: actions/upload-artifact@v4
        with:
          name: engine-release
          path: engine-release/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build, engines]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sqlguardllm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The five engine packages first, the client last (it lists them as optionalDependencies).
  # Every engine comes from the archives of this same run: checksums and the signed provenance
  # attestation are verified before anything is unpacked. A version already on npm is skipped, so
  # a failed run can simply be re-run.
  npm:
    name: Publish the Node.js client and engine packages to npm
    needs: [build, engines, attest]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/sqlguardllm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/node
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11, which Trusted Publishing needs (npm >= 11.5.1).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: engine-release/
      - name: Verify the engine archives (attestation, then checksums) and unpack them
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -e
          for f in engine-release/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
          python3 scripts/fetch-engine.py "$VERSION" --base-url engine-release --no-attestation --out engines
      - run: npm ci
      - name: Build the platform packages and the digests
        run: node npm/build.mjs --engines ../../engines --out npm/dist
      - name: Dry run, the same code path as publishing (npm pack, nothing is published)
        run: node npm/publish.mjs --out npm/dist --dry-run --pack-dir npm/packed
      - uses: actions/upload-artifact@v4
        with:
          name: npm-pack-files
          path: clients/node/npm/packed/*.files.txt
      - name: Publish (platform packages first, sqlguardllm last; prepublishOnly runs typecheck, build and tests)
        env:
          TAG: ${{ needs.build.outputs.npm_tag }}
        run: node npm/publish.mjs --out npm/dist --tag "$TAG"

  # The four packages (SqlGuardLlm with the five engines as runtimes/{rid}/native assets, then the three integration
  # packages that depend on it), same version, symbols (.snupkg) with them. The engines are the attested archives of
  # this same run, verified before anything is unpacked. Before the push, the packed package is restored by a consumer
  # project and the engine of this runner is started from it (SHA-256 check included).
  nuget:
    name: Publish the .NET packages to NuGet
    needs: [build, engines, attest]
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/SqlGuardLlm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: engine-release/
      - name: Verify the engine archives (attestation, then checksums), unpack and stage them
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -e
          for f in engine-release/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
          python3 scripts/fetch-engine.py "$VERSION" --base-url engine-release --no-attestation --out engines
          python3 clients/dotnet/build/stage-engines.py --engines engines
      - run: dotnet build -c Release
        working-directory: clients/dotnet
      - run: dotnet test -c Release --no-build
        working-directory: clients/dotnet
      - name: Pack (deterministic, SourceLink, symbols) and check size and contents
        env:
          NPM_VERSION: ${{ needs.build.outputs.npm_version }}
        run: |
          set -e
          for p in SqlGuardLlm SqlGuardLlm.Extensions SqlGuardLlm.EntityFrameworkCore SqlGuardLlm.SemanticKernel; do
            dotnet pack "clients/dotnet/src/$p" -c Release --no-build -o clients/dotnet/out
            test -f "clients/dotnet/out/$p.$NPM_VERSION.nupkg"
            test -f "clients/dotnet/out/$p.$NPM_VERSION.snupkg"
          done
          python3 clients/dotnet/build/stage-engines.py --check-nupkg "clients/dotnet/out/SqlGuardLlm.$NPM_VERSION.nupkg"
      - name: Consumer check, restoring the packed package and starting its engine
        env:
          NPM_VERSION: ${{ needs.build.outputs.npm_version }}
        run: dotnet run --project clients/dotnet/smoke -c Release -p:SqlGuardLlmVersion="$NPM_VERSION"
      # Exchanges the job's OIDC token for an API key that lives one hour.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the four packages (each .snupkg goes with its .nupkg)
        run: >-
          dotnet nuget push "clients/dotnet/out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  smoke:
    name: Install from PyPI and run
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: pip install sqlguardllm==${{ needs.build.outputs.version }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in 1 2 3 4 5 6 7 8; do
            if uv run --no-project --refresh --python 3.12 --with "sqlguardllm==$VERSION" python -c "
          import sqlguardllm
          from sqlguardllm import Guard, Policy
          guard = Guard(Policy(dialect='postgres', tables={'invoices'}))
          assert sqlguardllm.__version__ == '$VERSION', sqlguardllm.__version__
          assert not guard.check('DELETE FROM invoices').ok
          assert guard.check('SELECT id FROM invoices').sql == 'SELECT id FROM invoices LIMIT 1000'
          print('sqlguardllm', sqlguardllm.__version__, 'works')
          "; then exit 0; fi
            echo "Not available yet, retrying in 20 s"; sleep 20
          done
          exit 1

  github-release:
    name: GitHub release
    needs: [build, smoke, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: engine-release/
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          prerelease=""
          if echo "$VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* engine-release/* --title "sqlguardllm $VERSION" --notes-file notes.md $prerelease
