name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored anywhere.
# PyPI trusts this exact workflow file, in jmmana/sqlguardllm, running in the "pypi" environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tag, version and changelog agree
        id: version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: uv sync --locked && uv run pytest
      - name: Build
        run: uv build
      - name: Check
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sqlguardllm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  smoke:
    name: Install from PyPI and run
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: pip install sqlguardllm==${{ needs.build.outputs.version }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in 1 2 3 4 5 6 7 8; do
            if uv run --no-project --refresh --python 3.12 --with "sqlguardllm==$VERSION" python -c "
          import sqlguardllm
          from sqlguardllm import Guard, Policy
          guard = Guard(Policy(dialect='postgres', tables={'invoices'}))
          assert sqlguardllm.__version__ == '$VERSION', sqlguardllm.__version__
          assert not guard.check('DELETE FROM invoices').ok
          assert guard.check('SELECT id FROM invoices').sql == 'SELECT id FROM invoices LIMIT 1000'
          print('sqlguardllm', sqlguardllm.__version__, 'works')
          "; then exit 0; fi
            echo "Not available yet, retrying in 20 s"; sleep 20
          done
          exit 1

  github-release:
    name: GitHub release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          prerelease=""
          if echo "$VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "sqlguardllm $VERSION" --notes-file notes.md $prerelease
