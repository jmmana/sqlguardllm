name: Claude pilot (manual, owner only)

# No push, PR, pull_request_target, comment or public webhook trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-paid-pilot
  cancel-in-progress: false

jobs:
  pilot:
    # Four first attempts at most, each reserves <= $2.50. A rerun cannot
    # silently consume the user's $10 authorization again.
    if: >-
      github.repository == 'jmmana/sqlguardllm' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'jmmana' && github.triggering_actor == 'jmmana' &&
      github.run_attempt == 1 && github.run_number <= 4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install package without the model credential
        run: python -m pip install -e . sqlglot==30.35.0
      - name: Verify benchmark fixture and spending bound without API calls
        run: python research/claude_pilot.py
      - name: Run bounded model experiment
        env:
          ANTHROPIC_API_TOKEN: ${{ secrets.ANTHROPIC_API_TOKEN }}
        run: python research/claude_pilot.py --execute
      - name: Upload public and synthetic observations only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-spider-pilot
          path: research/results-claude/
          if-no-files-found: ignore
          retention-days: 30
