name: Node client
on:
  push:
    branches: [main]
    paths: ["clients/node/**", ".github/workflows/node-client.yml"]
  pull_request:
    paths: ["clients/node/**", ".github/workflows/node-client.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: clients/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
