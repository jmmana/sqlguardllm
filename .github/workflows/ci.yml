name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Tests and adversarial corpus
        env:
          SQLGUARD_FUZZ_PROFILE: fast
        run: uv run pytest
      - name: Upload fuzz results and minimized cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results-${{ matrix.python }}
          path: |
            research/results/fuzz.json
            tests/corpus/fuzz_regressions.yaml
          if-no-files-found: ignore

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata and the PyPI description
        run: uvx twine check --strict dist/*
