name: Bug report
description: sqlguardllm rejects a query it should accept, crashes, or behaves differently from the design.
title: "Bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ If sqlguardllm **accepts** SQL that it should reject, that's a security vulnerability: please report it privately instead ([SECURITY.md](https://github.com/jmmana/sqlguardllm/blob/main/SECURITY.md)).
  - type: input
    id: version
    attributes:
      label: Versions
      description: sqlguardllm, sqlglot and Python versions.
      placeholder: "sqlguardllm 0.1.0 · sqlglot 30.35.0 · Python 3.12"
    validations:
      required: true
  - type: input
    id: dialect
    attributes:
      label: Dialect
      placeholder: postgres
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Policy, context and SQL. No real data or credentials.
      render: python
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
