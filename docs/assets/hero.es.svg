<text x="760" y="356" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="start" >Una función entre el modelo y tu base de datos:</text>
