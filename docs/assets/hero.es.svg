<text x="40" y="70" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B" font-weight="700" text-anchor="start" letter-spacing="1.6">SQL QUE ESCRIBIÓ LA IA</text>
<rect x="40" y="88" width="600" height="112" rx="14" fill="#0A1513" stroke="#173A33"/>
<text x="60" y="120" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">WITH </tspan><tspan fill="#E2E8F0">d </tspan><tspan fill="#C4B5FD">AS </tspan><tspan fill="#E2E8F0">(</tspan><tspan fill="#C4B5FD">DELETE FROM </tspan><tspan fill="#E2E8F0">invoices</tspan></text>
<text x="60" y="142" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">RETURNING </tspan><tspan fill="#E2E8F0">*) </tspan><tspan fill="#C4B5FD">SELECT </tspan><tspan fill="#E2E8F0">* </tspan><tspan fill="#C4B5FD">FROM </tspan><tspan fill="#E2E8F0">d</tspan></text>
<rect x="60" y="166" width="81" height="22" rx="11" fill="rgba(248,113,113,0.12)" stroke="#F87171" stroke-opacity="0.7"/>
<text x="100.72" y="181" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#F87171" font-weight="700" text-anchor="middle" letter-spacing="1">BLOQUEADO</text>
<text x="153.44" y="181.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start" >escritura escondida en un CTE</text>
<rect x="40" y="216" width="600" height="92" rx="14" fill="#0A1513" stroke="#173A33"/>
<text x="60" y="248" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">SELECT </tspan><tspan fill="#E2E8F0">name, email </tspan><tspan fill="#C4B5FD">FROM </tspan><tspan fill="#E2E8F0">customers</tspan></text>
<rect x="60" y="274" width="81" height="22" rx="11" fill="rgba(248,113,113,0.12)" stroke="#F87171" stroke-opacity="0.7"/>
<text x="100.72" y="289" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#F87171" font-weight="700" text-anchor="middle" letter-spacing="1">BLOQUEADO</text>
<text x="153.44" y="289.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start" >customers.email es una columna oculta</text>
<rect x="40" y="324" width="600" height="112" rx="14" fill="#0A1513" stroke="#173A33"/>
<text x="60" y="356" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">SELECT </tspan><tspan fill="#E2E8F0">b.name, </tspan><tspan fill="#67E8F9">SUM</tspan><tspan fill="#E2E8F0">(i.total)</tspan></text>
<text x="60" y="378" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">FROM </tspan><tspan fill="#E2E8F0">invoices i </tspan><tspan fill="#C4B5FD">JOIN </tspan><tspan fill="#E2E8F0">branches b </tspan><tspan fill="#E2E8F0">…</tspan></text>
<rect x="60" y="402" width="81" height="22" rx="11" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-opacity="0.7"/>
<text x="100.72" y="417" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#34D399" font-weight="700" text-anchor="middle" letter-spacing="1">REESCRITO</text>
<text x="153.44" y="417.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start" >filtro del rol + límite de filas</text>
<text x="40" y="460" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B" font-weight="700" text-anchor="start" letter-spacing="1.6">LO QUE SE EJECUTA</text>
<rect x="40" y="474" width="600" height="162" rx="14" fill="#050C0B" stroke="#34D399" stroke-opacity="0.45"/>
<text x="60" y="504" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">SELECT </tspan><tspan fill="#E2E8F0">b.name, </tspan><tspan fill="#67E8F9">SUM</tspan><tspan fill="#E2E8F0">(i.total)</tspan></text>
<text x="60" y="526" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">FROM </tspan><tspan fill="#E2E8F0">(</tspan><tspan fill="#C4B5FD">SELECT </tspan><tspan fill="#E2E8F0">* </tspan><tspan fill="#C4B5FD">FROM </tspan><tspan fill="#E2E8F0">invoices</tspan></text>
<text x="60" y="548" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">      WHERE </tspan><tspan fill="#E2E8F0">branch_id </tspan><tspan fill="#C4B5FD">IN </tspan><tspan fill="#E2E8F0">(</tspan><tspan fill="#86EFAC">1, 2</tspan><tspan fill="#E2E8F0">)) </tspan><tspan fill="#C4B5FD">AS </tspan><tspan fill="#E2E8F0">i</tspan></text>
<text x="60" y="570" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">JOIN </tspan><tspan fill="#E2E8F0">branches </tspan><tspan fill="#C4B5FD">AS </tspan><tspan fill="#E2E8F0">b </tspan><tspan fill="#C4B5FD">ON </tspan><tspan fill="#E2E8F0">b.id = i.branch_id</tspan></text>
<text x="60" y="592" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">GROUP BY </tspan><tspan fill="#E2E8F0">b.name</tspan></text>
<text x="60" y="614" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#C4B5FD">LIMIT </tspan><tspan fill="#86EFAC">1000</tspan></text>
